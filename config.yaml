# Tier descriptions, as the paper's models appendix prints them.
tiers:
  A:
    description: "frontier flagships"
  B:
    description: "other frontier open-weight models"
  C:
    description: "smaller open-weight models"
    scale: "~8B"

# Figures the paper quotes from cited work (not computed by this benchmark).
# self_preference_points: Panickssery et al. (2024), absolute inflation on MT-Bench.
literature:
  self_preference_points: 10

# Human baseline collection protocol (Prolific). The paper's Human baseline
# paragraph and the exclusion count in the Limitations are generated from
# these fields. Responses live under data/generations/human__prolific-baseline.
human_baseline:
  id: human/prolific-baseline
  name: "Human baseline"
  platform: Prolific
  n_participants: 100
  min_approval_rate: 95
  min_prior_tasks: 100
  hourly_pay: "£6.03"
  median_minutes: 11
  median_seconds: 21
  n_excluded: 2

# Judge panel for Ward feature extraction. The panel composition is a design variable and is
# expected to be updated as stronger or more diverse judges become
# available.
# Aliases used as panel keys in paths and dataframes and as the OpenRouter
# request slug. `provider` pins the OpenRouter upstream that serves the
# judge (no fallbacks), as for the subject models. The pinned upstreams
# match the native APIs the earlier extraction rows were collected from.
# A judge with a `judge_overrides` entry goes to the native SDK instead,
# and its `provider` must name that SDK (e.g. `google`).
# The resolved upstream model is recorded per call as
# `judge_model_resolved` on every extraction row.
judge_models:
  - id: anthropic/claude-opus-4.6
    name: "Claude Opus 4.6"
    key: ClaudeOpus
    date: "2026-02-04"
    provider: anthropic
  - id: google/gemini-3.1-pro-preview
    name: "Gemini 3.1 Pro"
    key: Gemini
    date: "2025-12-17"
    provider: google
  - id: openai/gpt-5.4
    name: "GPT-5.4"
    key: GPT
    date: "2026-03-05"
    provider: openai

# Native-SDK routing. All extraction rows collected before 2026-10-11 used
# native SDKs (judge_model_resolved: claude-opus-4-6,
# gemini-3.1-pro-preview, gpt-5.4-2026-03-05). Claude and GPT now go
# through OpenRouter. Their probed calls showed no thinking or reasoning
# tokens on either route.
# Gemini stays native: OpenRouter sends no thinking setting, so Gemini
# thinks by default (~2500 reasoning tokens per call), whereas the
# Vertex calls set thinking_budget=0 and request a JSON response.
# Uncomment the Claude or GPT entry to return that judge to its native SDK.
judge_overrides:
#   anthropic/claude-opus-4.6:
#     provider: anthropic
#     # Claude Opus 4.6 is Anthropic's previous-generation Opus. It has a
#     # dated snapshot (claude-opus-4-5-20251101 is 4.5; the 4.6 tier is
#     # currently exposed only under its unversioned alias). Pricing is
#     # identical to Opus 4.7 ($5/$25 per Mtok); 4.6 accepts `temperature`,
#     # which is deprecated on 4.7, so it is preferable for a deterministic
#     # judge. The resolved version is recorded per-call as
#     # judge_model_resolved on every extraction row.
#     model_id: claude-opus-4-6
#     # Optional AWS Bedrock failover. When set to true, a 429 from the
#     # direct Anthropic API triggers a one-shot retry against Bedrock
#     # using `bedrock_model_id`. The judge then routes through Bedrock
#     # for a short cooldown (30 s) so subsequent calls do not re-trip
#     # the same per-minute rate limit. Once the cooldown lapses the
#     # next call tries the direct API again, returning to the primary
#     # path when traffic has cleared. Set the AWS env vars in .env to
#     # enable boto3's credential chain. `judge_model_resolved` will
#     # show the Bedrock slug for failed-over calls, the Anthropic slug
#     # otherwise; both target the same underlying snapshot.
#     bedrock_fallback: true
#     bedrock_model_id: us.anthropic.claude-opus-4-6-v1
  google/gemini-3.1-pro-preview:
    provider: google
    # Routed through Vertex AI rather than AI Studio. AI Studio's daily
    # per-model quota (250/day on Tier 1) is too low for the extraction
    # workload; Vertex exposes the same model with a much higher pool.
    # Auth: Application Default Credentials (gcloud auth application-default
    # login or GOOGLE_APPLICATION_CREDENTIALS pointing to a service-account
    # JSON). Project id and region come from GOOGLE_VERTEX_PROJECT and
    # GOOGLE_VERTEX_LOCATION in .env. The resolved version is recorded
    # per-call as judge_model_resolved; on Vertex the string is shaped
    # differently from the AI Studio response.
    model_id: gemini-3.1-pro-preview
    use_vertex: true
#   openai/gpt-5.4:
#     provider: openai
#     # Pinned to the dated March 2026 snapshot so the judge is reproducible
#     # at submission time and does not drift with OpenRouter's floating
#     # `openai/gpt-5.4` alias (which is in the subject pool).
#     model_id: gpt-5.4

# Primary metric for AlienBench. The Ward Departure Score is the only
# primary metric; a holistic creativity rubric was considered during pilot
# development and excluded because two sub-dimensions had near-zero
# Krippendorff's alpha (Elaboration α = −0.044; Internal Consistency
# α = −0.014). If a secondary creativity metric is ever re-introduced, it
# should be reported separately as an appendix result and not mixed with
# the Ward primary metric.
primary_metric: ward

# Canonical per-cell sample count. Every pipeline stage
# (generate / extract / score / analyze / human) clips to the first
# `samples_per_condition` records per (subject_model, prompt_variant)
# cell, ordered ascending by `sample_index`. On-disk records above this
# N (e.g. from an earlier run at a higher N) remain on disk but are
# silently skipped by downstream stages.
samples_per_condition: 30

# Per-cell sample count used only by the Prompt Paraphrase Sensitivity
# ablation (alienbench/ablation_prompt.py). Set lower than
# samples_per_condition because each paraphrase requires a full
# generate+extract+score pass over every (subject_model, judge) cell, and the
# ablation trades per-cell precision for breadth across paraphrases. The
# baseline paraphrase reuses main-pipeline data via the shared on-disk paths
# and therefore inherits the main-pipeline N at that cell only.
prompt_ablation_samples_per_condition: 10

# Generation parameters
temperature: 1.0
# Output-token limits. Every response must end on the model's own stop
# token. A call starts at `max_tokens`. A response cut off at the limit is
# discarded (logged in `cut_offs.jsonl` next to `responses.jsonl`), and the
# call is repeated with the limit doubled, up to `max_tokens_ceiling`. A
# response still cut off at the ceiling is not recorded, so the next run
# retries it. Every record stores the limit it was produced under
# (`max_tokens`) and the number of discarded calls (`n_cut_offs`).
# Subject models start at the ceiling, so a call is never repeated at a
# raised limit. A response cut off at 64000 is not recorded. The limit
# leaves room for the hidden reasoning of thinking models, which counts
# against the same limit. A model whose provider caps output below 64000
# needs a `model_overrides` entry (Llama 4 Maverick allows 16384 on
# OpenRouter).
# The section "Output-token limits" in results/claims_check.md reports the
# limits, the raised records, and any sample still cut off at the ceiling.
max_tokens: 64000
max_tokens_ceiling: 64000

# The same rule for the judges' extraction calls. A judge entry under
# `judge_models` may set its own `max_tokens` and `max_tokens_ceiling`.
judge_max_tokens: 8000
judge_max_tokens_ceiling: 32000

# Per-subject-model overrides for the output-token limits, e.g.
#   model_overrides:
#     some/model:
#       max_tokens: 32000
#       max_tokens_ceiling: 16384   # the provider's output limit
model_overrides:
  meta-llama/llama-4-maverick:
    max_tokens: 16384
    max_tokens_ceiling: 16384


# Prompt variants
prompt_variants:
  - id: baseline
    acronym: "Base"
    name: "Baseline"
    label: "Baseline"
    text: "Imagine a creature that lives on an alien planet. Describe it in detail."

  - id: departure_primed
    acronym: "Dep-P"
    name: "Departure-primed"
    label: "Departure-primed"
    text: "Imagine a creature on an alien planet that is as different from any Earth creature as possible. Describe it in detail."

  - id: constrained_no_light
    acronym: "NoLight"
    name: "Constrained: no light"
    label: "Constrained: No Light"
    text: "Imagine a creature that lives on a planet with no light at all. Describe it in detail."

  - id: constrained_high_gravity
    acronym: "HighG"
    name: "Constrained: high gravity"
    label: "Constrained: High Gravity"
    text: "Imagine a creature that lives on a planet with 10x Earth's gravity. Describe it in detail."

  - id: constrained_ammonia
    acronym: "NH$_3$"
    name: "Constrained: ammonia oceans"
    label: "Constrained: Ammonia Oceans"
    text: "Imagine a creature that lives on a planet with oceans of liquid ammonia instead of water. Describe it in detail."

  - id: detailed_description
    acronym: "Detail"
    name: "Detailed description"
    label: "Detailed description"
    text: "Imagine a creature on an alien planet. Describe it in full detail, including any aspects of its biology that would help someone understand what kind of organism it is."

# Surface rewordings of the baseline prompt used only by the Prompt
# Paraphrase Sensitivity ablation (paper sec:ablation_prompt). We do not
# assert semantic equivalence: the entries are authored rewordings that
# re-use the baseline's framing (a creature, an alien or non-Earth
# planet, a request for a detailed description) without introducing
# vocabulary that goes beyond the baseline's priming (e.g. we avoid
# "beyond our solar system", "extraterrestrial", or category-narrowing
# nouns such as "animal"). The ablation treats each paraphrase as a
# surface variant of the baseline, and the paper quantifies the
# remaining surface-level divergence between them rather than claiming
# intent preservation. The ``baseline`` entry repeats the canonical
# wording so the ablation's rank-correlation matrix includes the
# wording used in the primary analysis.
prompt_paraphrases:
  - id: baseline
    label: "Baseline"
    text: "Imagine a creature that lives on an alien planet. Describe it in detail."
  - id: baseline_para_a
    label: "Paraphrase A"
    text: "Picture an organism that lives on a planet other than Earth. Write a detailed description of it."
  - id: baseline_para_b
    label: "Paraphrase B"
    text: "Describe, in detail, a creature that lives on another planet."
  - id: baseline_para_c
    label: "Paraphrase C"
    text: "Imagine a living being that evolved on a planet other than Earth. Describe it in detail."
  - id: baseline_para_d
    label: "Paraphrase D"
    text: "Think of a creature that comes from an alien planet. Describe what it looks like and how it lives in detail."
  - id: baseline_para_e
    label: "Paraphrase E"
    text: "Envision a creature found on an alien world. Provide a detailed description of it."

# Data directory (relative to project root)
data_dir: data

# Results directory
results_dir: results

# OpenRouter API key env var name
api_key_env: OPENROUTER_API_KEY

# OpenRouter base URL
openrouter_base_url: "https://openrouter.ai/api/v1"
