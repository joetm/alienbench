# AlienBench Configuration

# Subject models under evaluation (OpenRouter model IDs).
# The canonical baseline set below is tiered on frontier capability rather
# than on openness: Tier A collects the four flagship "frontier camps"
# (Anthropic, OpenAI, Google, DeepSeek), Tier B adds the remaining major
# frontier open-weight providers (Meta, Alibaba, Mistral), and Tier C gives
# a ~8B small-model baseline from the same three Tier-B providers so the
# benchmark exposes a within-provider scaling axis.
# Each entry carries everything the paper prints about the model: the
# OpenRouter id (the key for paths and dataframes), the human-readable
# name, a letters-only `key` for the generated LaTeX macros, the tier, and
# the dated provider snapshot OpenRouter resolved the id to. The paper's
# model names and the models appendix table are generated from these
# fields (`alienbench paper`); nothing in paper.tex restates them.
# `provider` pins the OpenRouter upstream that serves the model, as a
# provider slug with an optional variant (e.g. `openai`, `openai/flex`,
# `deepinfra/fp8`). Requests then go only to that provider, without
# fallbacks. `null` keeps the default routing (`allowed_providers`, or the
# built-in provider order with fallbacks).
